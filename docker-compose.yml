services:
  node_modules_permissions:
    image: node:24-alpine
    user: "0:0"
    volumes:
      - node_modules:/app/node_modules
    command: ["chown", "-R", "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}", "/app/node_modules"]

  api:
    build: .
    ports:
      - "3000:3000"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      node_modules_permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: sh -c "npm ci && exec npm run start:dev"

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  node_modules:
  postgres_data:
  mongo_data:
